<!DOCTYPE html>
<html lang="vi-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Tiếng Việt A0 | 越南语A0学习程序</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶部导航 -->
<div class="nav-bar">
<div class="container nav-container">
<button class="nav-btn" data-target="lessonList">📚 课程总览 Danh sách bài học</button>
<button class="nav-btn" data-target="vocLib">📖 词汇库 Từ vựng</button>
<button class="nav-btn" data-target="flashCard">🃏 闪卡复习 Thẻ nhớ</button>
<button class="nav-btn" data-target="dialogue">💬 对话练习 Hội thoại</button>
<button class="nav-btn" data-target="grammar">📝 语法 Ngữ pháp</button>
<button class="nav-btn" data-target="exercise">✏️ 练习题 Bài tập</button>
</div>
</div>

<div class="container">
    <!-- 1.课程总览模块 -->
    <div id="lessonList" class="module show">
        <div class="card">
            <h2 class="card-title">Danh sách bài học A0（A0课程列表）</h2>
            <div class="tip">共30课，点击切换课程</div>
            <div id="lessonBox"></div>
        </div>
    </div>

    <!-- 2.词汇库模块 -->
    <div id="vocLib" class="module">
        <div class="card">
            <h2 class="card-title">Từ vựng 词汇库</h2>
            <div class="tip">当前课程：<span id="currLessonName"></span></div>
            <div id="vocBox"></div>
        </div>
    </div>

    <!-- 3.闪卡复习模块 -->
    <div id="flashCard" class="module">
        <div class="card">
            <h2 class="card-title">Thẻ nhớ 单词闪卡</h2>
            <div class="tip">点击卡片翻面，可播放发音</div>
            <div class="flashcard-wrap" id="flipWrap">
                <div class="flashcard">
                    <div class="flash-front">
                        <img class="flash-img" id="flashImg" src="" alt="配图">
                        <p id="flashVN"></p>
                        <button class="audio-btn" id="flashAudio">▶</button>
                    </div>
                    <div class="flash-back">
                        <p id="flashCN"></p>
                        <p style="font-size:14px;margin-top:8px;" id="flashEx"></p>
                    </div>
                </div>
            </div>
            <div style="text-align:center;margin-top:10px;">
                <button class="btn btn-blue" id="prevCard">← Trước 上一张</button>
                <button class="btn btn-blue" id="nextCard">Sau → 下一张</button>
                <span class="tip" id="cardIndex"></span>
            </div>
        </div>
    </div>

    <!-- 4.对话练习模块 -->
    <div id="dialogue" class="module">
        <div class="card">
            <h2 class="card-title">Hội thoại 对话练习</h2>
            <div class="tip">场景插图+单句发音跟读</div>
            <div id="dialogImgBox"></div>
            <div id="dialogBox"></div>
        </div>
    </div>

    <!-- 5.语法讲解模块 -->
    <div id="grammar" class="module">
        <div class="card">
            <h2 class="card-title">Ngữ pháp 语法讲解</h2>
            <div id="grammarBox"></div>
        </div>
    </div>

    <!-- 6.课后习题模块 -->
    <div id="exercise" class="module">
        <div class="card">
            <h2 class="card-title">Bài tập 课后练习题</h2>
            <div class="tip">每课随机≥15道，单选/填词/看图题型</div>
            <button class="btn btn-blue" id="genExercise">Tạo đề ngẫu nhiên 随机出题</button>
            <div id="exBox"></div>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
